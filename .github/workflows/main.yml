name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64

          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x64

          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64

          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build -- --target ${{ matrix.target }}

      # Replace "agent-spyglass" with your actual Cargo binary name.
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp \
              "src-tauri/target/${{ matrix.target }}/release/agent-spyglass.exe" \
              "artifacts/agent-spyglass-${{ matrix.artifact }}.exe"
          else
            cp \
              "src-tauri/target/${{ matrix.target }}/release/agent-spyglass" \
              "artifacts/agent-spyglass-${{ matrix.artifact }}"

            chmod +x "artifacts/agent-spyglass-${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-spyglass-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error


  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: app-v${{ steps.version.outputs.version }}
          name: App v${{ steps.version.outputs.version }}
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
