<div class="app-container">
    <flow #flow></flow>

    <div class="top-right-controls">
        @for (control of zoomControls; track control.label) {
            <button
                class="icon-button"
                [title]="control.label"
                [disabled]="control.disabled()"
                (click)="control.action()">
                <hugeicons-icon [icon]="control.icon" />
            </button>
        }
    </div>

    <session-info [list]="todoList()" [usage]="usage()" />

    <agent-modal />

    <presentation-controls />
</div>
