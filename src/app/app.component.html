<header class="hidden fixed top-3 left-3 bg-bg text-accent hover:text-text transition border border-accent p-1 shadow rounded-lg md:flex items-center ">
	<a href="https://github.com/vitorblog/agentspyglass" target="_blank" class="p-2 py-1 rounded-lg font-black transition hover:bg-accent/30 inline-flex items-center gap-2">
		<hugeicons-icon
				[icon]="Telescope01Icon"
				[size]="24"
				color="currentColor"
				[strokeWidth]="1.5"
		/>
		AgentSpyglass
	</a>
</header>

<todo [list]="todoList()"></todo>

<div class="fixed bottom-3 bg-bg left-3 z-10 flex items-center gap-1 rounded-lg border border-accent p-1 shadow">
	<button
			class="grid h-8 w-8 place-items-center rounded-md text-accent transition hover:bg-accent/30 hover:text-text cursor-pointer disabled:cursor-not-allowed disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:text-text"
			(click)="zoomIn()"
			[disabled]="atMaxZoom()"
			aria-label="Zoom in"
			title="Zoom in"
	>
		<hugeicons-icon
				[icon]="ZoomIn"
				[size]="18"
				color="currentColor"
				[strokeWidth]="1.5" />
	</button>
	<button
			class="grid h-8 w-8 place-items-center rounded-md text-accent transition hover:bg-accent/30 hover:text-text cursor-pointer disabled:cursor-not-allowed disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:text-text"
			(click)="zoomOut()"
			[disabled]="atMinZoom()"
			aria-label="Zoom out"
			title="Zoom out"
	>
		<hugeicons-icon
				[icon]="ZoomOut"
				[size]="18"
				color="currentColor"
				[strokeWidth]="1.5" />
	</button>
	<button
			class="grid h-8 w-8 place-items-center rounded-md text-accent transition hover:bg-accent/30 hover:text-text cursor-pointer disabled:cursor-not-allowed disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:text-text"
			(click)="fitView()"
			aria-label="Fit view"
			title="Fit all nodes"
	>
		<hugeicons-icon
				[icon]="Expand"
				[size]="18"
				color="currentColor"
				[strokeWidth]="1.5" />
	</button>
</div>

<flow></flow>
