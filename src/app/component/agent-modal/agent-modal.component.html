@if (agent(); as agent) {
	<div #overlay class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity"
	     (click)="close()">
		<div #panel class="bg-bg border border-accent rounded-lg shadow-xl w-[80vw] max-w-5xl h-[75vh] flex flex-col overflow-hidden"
		     (click)="$event.stopPropagation()">
			<div class="flex items-center justify-between p-3 border-b border-accent/30">
				<h2 class="font-black text-accent inline-flex items-center gap-2">
					<hugeicons-icon
							[icon]="WorkflowSquareIcon"
							[size]="20"
							color="currentColor"
							[strokeWidth]="1.5"
					/>
					{{ agent.name | nameCase }}
				</h2>
				<button
						class="grid h-8 w-8 place-items-center rounded-md text-accent transition hover:bg-accent/30 hover:text-text cursor-pointer"
						(click)="close()"
						aria-label="Close agent details"
				>
					<hugeicons-icon
							[icon]="Cancel01Icon"
							[size]="18"
							color="currentColor"
							[strokeWidth]="1.5"
					/>
				</button>
			</div>

			<div class="flex-1 min-h-0">
				<vflow
						view="auto"
						[nodes]="nodes()"
						[edges]="edges()"
						[minZoom]="0.35"
						[maxZoom]="1.25"
						[background]="{ type: 'dots', gap: 25, color: 'rgba(100,100,50,0.3)', backgroundColor: '#040504' }"
				/>
			</div>
		</div>
	</div>
}
