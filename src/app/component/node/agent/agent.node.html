<section
		class="min-w-80 max-w-96 border-accent border {{ isSubagent()? 'bg-secondary/20' : 'bg-accent/20' }} p-4 py-4 rounded-lg flex flex-col gap-4"
		[class.border-secondary]="isSubagent()"
		[class.cursor-pointer]="isSubagent()">
	@if (agent(); as a) {
		<div class="font-black inline-flex items-center justify-between h-full gap-2">
			<section class="font-black inline-flex items-center h-full gap-2">
				<img [src]="a.brand.logo" alt="AI logo" defaultImage="assets/agent_not_found.svg"
				     class="bg-white border-1 border-accent size-8 p-1 rounded-xl">

				<div>
					<div>{{ a.name | nameCase }}</div>
					<div class="text-xs font-light text-text/50">
						{{ a.model | lowercase }}
					</div>
				</div>
			</section>

			@if (!isUser() && !inModal()) {
				<button class="flex items-center justify-center w-8 h-8 rounded-lg border-1 border-tertiary cursor-pointer hover:bg-accent/30 hover:text-text"
				        (click)="openModal()"
				        aria-label="Open agent details"
				        title="Open agent details">
					<hugeicons-icon
							[icon]="ArrowExpandDiagonal01Icon"
							[size]="24"
							color="currentColor"
							[strokeWidth]="2"
					/>
				</button>
			}
		</div>

		<div class="flex items-center gap-3 text-xs font-light text-text/50">
			<span class="inline-flex items-center gap-1">
				<hugeicons-icon [icon]="Coins01Icon" [size]="12" color="currentColor" [strokeWidth]="2"/>
				{{ (a.cost ?? 0) | compactNumber }}
			</span>
			<span class="inline-flex items-center gap-1">
				<hugeicons-icon [icon]="CpuIcon" [size]="12" color="currentColor" [strokeWidth]="2"/>
				{{ (a.tokens ?? 0) | compactNumber }}
			</span>
		</div>
	} @else {
		<div class="inline-flex items-center gap-2">
			<img src="assets/not_found.svg" alt="Unknown agent" class="bg-white border-1 border-accent size-8 p-1 rounded-xl">
			<div>Loading...</div>
		</div>
	}
</section>

@if (isUser()) {
	<handle type="source" position="bottom" id="s-bottom"/>
} @else {
	<handle type="source" position="right" id="s-right"/>
	<handle type="source" position="bottom" id="s-bottom"/>
}
<handle type="source" position="left" id="s-left"/>
<handle type="target" position="top" id="t-top"/>
<handle type="target" position="left" id="t-left"/>
