@if (list().length > 0 || usage()) {
	<section class="mx-3 md:m-0 p-2 py-1 fixed top-3 bg-bg md:right-3 max-w-96 w-full md:w-60 text-accent transition border border-accent shadow rounded-lg flex flex-col">
		<div class="p-2 py-1 inline-flex items-center justify-between w-full cursor-pointer" (click)="toggle()">
			<h1 class="font-black items-center gap-2 hidden md:inline-flex">
				<hugeicons-icon
						[icon]="CheckListIcon"
						[size]="24"
						color="currentColor"
						[strokeWidth]="1.5"
				/>
				Info
			</h1>

			<h1 class="font-black items-center gap-2 inline-flex md:hidden">
				<hugeicons-icon
						[icon]="BinocularsIcon"
						[size]="24"
						color="currentColor"
						[strokeWidth]="1.5"
				/>
				AgentSpyglass
			</h1>

			<hugeicons-icon
					[icon]="ChevronDown"
					[altIcon]="ChevronUp"
					[showAlt]="open()"
					[size]="24"
					color="currentColor"
					[strokeWidth]="1.5"
			/>
		</div>

		@if (open()) {
			@if (usage(); as u) {
				<div class="border-t border-accent/30 pt-2 pb-1 space-y-1.5">
					<div class="flex items-center justify-between text-xs">
						<span class="inline-flex items-center gap-1 text-accent/70">
							<hugeicons-icon [icon]="Coins01Icon" [size]="14" color="currentColor" [strokeWidth]="1.5"/>
							Cost
						</span>
						<span class="font-mono font-bold">{{ formatCost(u.cost) }}</span>
					</div>
					<div class="flex items-center justify-between text-xs">
						<span class="inline-flex items-center gap-1 text-accent/70">
							<hugeicons-icon [icon]="CpuIcon" [size]="14" color="currentColor" [strokeWidth]="1.5"/>
							Tokens
						</span>
						<span class="font-mono font-bold">{{ formatTokens(u.tokens) }}</span>
					</div>
					<div class="text-xs">
						<div class="flex items-center justify-between mb-1">
							<span class="text-accent/70">Context</span>
							<span class="font-mono font-bold">{{ u.contextUsed }}%</span>
						</div>
						<div class="w-full h-1.5 bg-accent/10 rounded-full overflow-hidden">
							<div
								class="h-full rounded-full transition-all duration-500"
								[style.width.%]="u.contextUsed"
								[class]="u.contextUsed > 80 ? 'bg-red-500' : u.contextUsed > 50 ? 'bg-yellow-500' : 'bg-green-500'"
							></div>
						</div>
					</div>
				</div>
			}

			@if (list().length > 0) {
				<div class="border-t border-accent/30 pt-1">
					@for (todo of list(); track todo.content) {
						<div class="inline-flex items-center gap-2 text-xs font-light py-1">
							<hugeicons-icon
									[icon]="SquareIcon"
									[altIcon]="CheckmarkSquare01Icon"
									[showAlt]="todo.status == 'completed'"
									[size]="24"
									color="currentColor"
									[strokeWidth]="1.5"
							/>

							<p class="w-48 h-4 whitespace-pre-wrap break-words line-clamp-1">
								{{ todo.content }}
							</p>
						</div>
					}
				</div>
			}
		}
	</section>
}
